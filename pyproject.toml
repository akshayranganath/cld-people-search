[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudinary-people"
version = "0.1.2"
description = "Python SDK for the Cloudinary People Search API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["cloudinary", "people", "face-recognition", "sdk"]
authors = [{ name = "Akshay Ranganath", email = "akshay.ranganath@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "requests>=2.32.0,<3",
    "pydantic~=2.0",
]

[project.urls]
Homepage = "https://github.com/akshayranganath/cld-people-search"
Source = "https://github.com/akshayranganath/cld-people-search"
"Bug Tracker" = "https://github.com/akshayranganath/cld-people-search/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.8",
    "types-requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudinary_people*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cloudinary_people"]
